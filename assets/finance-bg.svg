<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none" role="img" aria-label="">
  <defs>
    <linearGradient id="brand" x1="120" y1="120" x2="1080" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdd30f"/>
      <stop offset=".46" stop-color="#90ceee"/>
      <stop offset="1" stop-color="#2789ff"/>
    </linearGradient>
    <linearGradient id="cool" x1="700" y1="220" x2="1120" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#90ceee"/>
      <stop offset="1" stop-color="#2789ff"/>
    </linearGradient>
    <linearGradient id="area" x1="300" y1="330" x2="300" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2789ff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#2789ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="760" y1="200" x2="1120" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".015"/>
    </linearGradient>
  </defs>

  <!-- alone morbido -->
  <circle cx="930" cy="300" r="250" fill="#2789ff" opacity=".05"/>
  <circle cx="1010" cy="250" r="150" fill="#90ceee" opacity=".06"/>

  <!-- carta secondaria -->
  <g transform="rotate(-9 900 250)" opacity=".55">
    <rect x="712" y="128" width="396" height="246" rx="30" stroke="url(#brand)" stroke-width="2.2"/>
    <rect x="712" y="128" width="396" height="246" rx="30" fill="url(#face)"/>
    <path d="M744 214h332" stroke="url(#brand)" stroke-width="2" opacity=".5"/>
  </g>

  <!-- carta principale -->
  <g transform="rotate(5 960 330)">
    <rect x="784" y="212" width="372" height="232" rx="28" stroke="url(#cool)" stroke-width="2.4" fill="url(#face)"/>
    <rect x="824" y="296" width="58" height="42" rx="10" stroke="url(#brand)" stroke-width="2.2"/>
    <path d="M840 306v22M856 306v22M872 306v22" stroke="url(#brand)" stroke-width="1.4" opacity=".7"/>
    <path d="M1064 288c10 10 10 26 0 36M1078 278c17 17 17 45 0 62M1092 268c24 24 24 64 0 88" stroke="url(#cool)" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
    <path d="M824 392h96" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <circle cx="1090" cy="404" r="17" stroke="url(#brand)" stroke-width="2" opacity=".8"/>
    <circle cx="1066" cy="404" r="17" stroke="url(#cool)" stroke-width="2" opacity=".7"/>
  </g>

  <!-- linea di crescita + area -->
  <path d="M92 688C178 662 224 600 306 604S438 512 514 470 632 414 706 342" fill="none" stroke="url(#brand)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M92 688C178 662 224 600 306 604S438 512 514 470 632 414 706 342V760H92Z" fill="url(#area)"/>
  <g fill="#2789ff">
    <circle cx="306" cy="604" r="5" opacity=".55"/>
    <circle cx="514" cy="470" r="5" opacity=".6"/>
    <circle cx="706" cy="342" r="5" opacity=".65"/>
  </g>

  <!-- monete -->
  <g opacity=".7">
    <ellipse cx="842" cy="742" rx="62" ry="18" stroke="url(#brand)" stroke-width="2.2"/>
    <ellipse cx="842" cy="724" rx="62" ry="18" stroke="url(#brand)" stroke-width="2.2" opacity=".8"/>
    <ellipse cx="842" cy="706" rx="62" ry="18" stroke="url(#brand)" stroke-width="2.2" opacity=".6"/>
    <path d="M812 700v42M842 700v42M872 700v42" stroke="url(#brand)" stroke-width="1.6" opacity=".5"/>
  </g>

  <!-- dettagli -->
  <g stroke="url(#cool)" stroke-linecap="round" opacity=".8">
    <path d="M158 214v28M144 228h28" stroke-width="2.4"/>
    <path d="M1046 640v20M1036 650h20" stroke-width="2"/>
    <circle cx="196" cy="430" r="7" stroke-width="2"/>
    <circle cx="1014" cy="748" r="9" stroke-width="2" opacity=".7"/>
  </g>
</svg>
