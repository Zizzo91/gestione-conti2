name: Supabase keepalive

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch: {}

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping progetto Supabase (anti-pausa free tier)
        if: env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        run: curl -sS -o /dev/null -w "HTTP %{http_code}\n" "$SUPABASE_URL/rest/v1/entries?select=month&limit=1" -H "apikey: $SUPABASE_ANON_KEY"
      - name: Avviso se le variabili non sono impostate
        if: env.SUPABASE_URL == '' || env.SUPABASE_ANON_KEY == ''
        run: echo "::warning title=Keepalive disattivato::Imposta SUPABASE_URL e SUPABASE_ANON_KEY nelle Actions variables del repo (Settings -> Secrets and variables -> Actions -> Variables)."